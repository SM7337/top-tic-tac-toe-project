<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>Tic Tac Toe</h1>
    <form action="">
      <label for="p1">Player 1 Name</label>
      <input type="text" name="p1" id="p1" maxlength="30" required />
      <label for="p2">Player 2 Name</label>
      <input type="text" name="p2" id="p2" maxlength="30" required />
      <button type="submit">Start</button>
    </form>
    <div class="content">
      <div class="gameBoard">
        <div data-index="0"></div>
        <div data-index="1"></div>
        <div data-index="2"></div>
        <div data-index="3"></div>
        <div data-index="4"></div>
        <div data-index="5"></div>
        <div data-index="6"></div>
        <div data-index="7"></div>
        <div data-index="8"></div>
      </div>
      <p class="info">Player Turns and other info</p>
      <button id="restart">Restart</button>
    </div>
    <footer>© 2025 Savindu</footer>
    <script src="./script.js"></script>
  </body>
</html>
